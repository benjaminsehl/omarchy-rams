# Rams: generated by tools/build.py from colors.toml.
# Every surface is opaque and edged with a thin rule. Orange marks the one
# thing that is focused, selected or active. Red means an error, nothing else.

[bar]
background       = "#eeebe5"
background-alpha = 1.0
text             = "#2b2a27"
# Recording, dictation, alerts: the signal colour, like a power indicator.
active           = "#d4521c"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
active-border            = "#3a3935"
active-border-foreground = "#3a3935"

[controls]
normal-color        = "#2b2a27"
normal-fill-alpha   = 0.0
normal-border       = "#2b2a27"
normal-border-width = 1
normal-border-alpha = 0.22

hover-cursor-color        = "#2b2a27"
hover-cursor-fill-alpha   = 0.06
hover-cursor-border       = "#2b2a27"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.40

# Keyboard focus is a signal, so it gets the accent.
focus-color        = "#2b2a27"
focus-fill-alpha   = 0.06
focus-border       = "#d4521c"
focus-border-width = 1
focus-border-alpha = 1.0

# Selected: a pressed switch. Solid ink, no outline.
selected-color        = "#2b2a27"
selected-fill-alpha   = 0.12
selected-border       = "#2b2a27"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.30

[spacing]
# A slightly more generous grid than the default; things breathe.
scale = 1.08
scale-with-font = true

[font]
base-size = 12
# A short Swiss scale: few sizes, clearly apart.
caption       = 10
body-small    = 11
body          = 12
subtitle      = 13
title         = 14
heading       = 15
display       = 20
display-large = 24

[popups]
background       = "#eeebe5"
background-alpha = 1.0
text             = "#2b2a27"
border           = "#cfccc7"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#2b2a27"
background-alpha = 1.0
text             = "#eeebe5"
border           = "#2b2a27"
border-alpha     = 1.0

[notifications]
background       = "#eeebe5"
background-alpha = 1.0
text             = "#2b2a27"
border           = "#cfccc7"
border-alpha     = 1.0
border-width     = 1
countdown        = "#d4521c"

[launcher]
background                = "#eeebe5"
background-alpha          = 1.0
text                      = "#2b2a27"
border                    = "#cfccc7"
border-alpha              = 1.0
scrim                     = "#eeebe5"
scrim-alpha               = 0.35
selected-background       = "#2b2a27"
selected-background-alpha = 0.07
selected-text             = "#d4521c"
selected-border           = "#2b2a27"
selected-border-alpha     = 0.0

[menu]
background                = "#eeebe5"
background-alpha          = 1.0
text                      = "#2b2a27"
border                    = "#cfccc7"
border-alpha              = 1.0
scrim                     = "#eeebe5"
scrim-alpha               = 0.35
selected-background       = "#2b2a27"
selected-background-alpha = 0.07
selected-text             = "#d4521c"
selected-border           = "#2b2a27"
selected-border-alpha     = 0.0

[polkit]
background       = "#eeebe5"
background-alpha = 1.0
text             = "#2b2a27"
text-error       = "#c23b1e"
border           = "#3a3935"
border-error     = "#c23b1e"
border-alpha     = 1.0
scrim            = "#eeebe5"
scrim-alpha      = 0.6
accent           = "#d4521c"

[lock]
background       = "#eeebe5"
background-alpha = 1.0
text             = "#2b2a27"
placeholder      = "#797773"
text-error       = "#c23b1e"
# Idle: a quiet rule. Typing: the signal colour. Wrong: red.
border           = "#cfccc7"
border-active    = "#d4521c"
border-error     = "#c23b1e"
border-alpha     = 1.0
selection        = "#d4521c"
selection-alpha  = 0.35

[image-picker]
scrim                   = "#eeebe5"
scrim-alpha             = 0.85
text                    = "#2b2a27"
selected-border         = "#d4521c"
selected-border-alpha   = 1.0
unselected-border       = "#2b2a27"
unselected-border-alpha = 0.15
