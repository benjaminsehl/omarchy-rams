# Rams: generated by tools/build.py from colors.toml.
# Every surface is opaque and edged with a thin rule. Orange marks the one
# thing that is focused, selected or active. Red means an error, nothing else.

[bar]
background       = "#0e0e0d"
background-alpha = 1.0
text             = "#dedad2"
# Recording, dictation, alerts: the signal colour, like a power indicator.
active           = "#f0692b"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
active-border            = "#b9b4aa"
active-border-foreground = "#b9b4aa"

[controls]
normal-color        = "#dedad2"
normal-fill-alpha   = 0.0
normal-border       = "#dedad2"
normal-border-width = 1
normal-border-alpha = 0.22

hover-cursor-color        = "#dedad2"
hover-cursor-fill-alpha   = 0.06
hover-cursor-border       = "#dedad2"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.40

# Keyboard focus is a signal, so it gets the accent.
focus-color        = "#dedad2"
focus-fill-alpha   = 0.06
focus-border       = "#f0692b"
focus-border-width = 1
focus-border-alpha = 1.0

# Selected: a pressed switch. Solid ink, no outline.
selected-color        = "#dedad2"
selected-fill-alpha   = 0.12
selected-border       = "#dedad2"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.30

[spacing]
# A slightly more generous grid than the default; things breathe.
scale = 1.08
scale-with-font = true

[font]
base-size = 12
# A short Swiss scale: few sizes, clearly apart.
caption       = 10
body-small    = 11
body          = 12
subtitle      = 13
title         = 14
heading       = 15
display       = 20
display-large = 24

[popups]
background       = "#0e0e0d"
background-alpha = 1.0
text             = "#dedad2"
border           = "#2f2f2d"
border-alpha     = 1.0
border-width     = 1

[tooltip]
background       = "#dedad2"
background-alpha = 1.0
text             = "#1d1c1a"
border           = "#dedad2"
border-alpha     = 1.0

[notifications]
background       = "#0e0e0d"
background-alpha = 1.0
text             = "#dedad2"
border           = "#2f2f2d"
border-alpha     = 1.0
border-width     = 1
countdown        = "#f0692b"

[launcher]
background                = "#0e0e0d"
background-alpha          = 1.0
text                      = "#dedad2"
border                    = "#2f2f2d"
border-alpha              = 1.0
scrim                     = "#0e0e0d"
scrim-alpha               = 0.35
selected-background       = "#dedad2"
selected-background-alpha = 0.07
selected-text             = "#f0692b"
selected-border           = "#dedad2"
selected-border-alpha     = 0.0

[menu]
background                = "#0e0e0d"
background-alpha          = 1.0
text                      = "#dedad2"
border                    = "#2f2f2d"
border-alpha              = 1.0
scrim                     = "#0e0e0d"
scrim-alpha               = 0.35
selected-background       = "#dedad2"
selected-background-alpha = 0.07
selected-text             = "#f0692b"
selected-border           = "#dedad2"
selected-border-alpha     = 0.0

[polkit]
background       = "#0e0e0d"
background-alpha = 1.0
text             = "#dedad2"
text-error       = "#e2553a"
border           = "#b9b4aa"
border-error     = "#e2553a"
border-alpha     = 1.0
scrim            = "#0e0e0d"
scrim-alpha      = 0.6
accent           = "#f0692b"

[lock]
background       = "#0e0e0d"
background-alpha = 1.0
text             = "#dedad2"
placeholder      = "#918e88"
text-error       = "#e2553a"
# Idle: a quiet rule. Typing: the signal colour. Wrong: red.
border           = "#2f2f2d"
border-active    = "#f0692b"
border-error     = "#e2553a"
border-alpha     = 1.0
selection        = "#f0692b"
selection-alpha  = 0.35

[image-picker]
scrim                   = "#0e0e0d"
scrim-alpha             = 0.85
text                    = "#dedad2"
selected-border         = "#f0692b"
selected-border-alpha   = 1.0
unselected-border       = "#dedad2"
unselected-border-alpha = 0.15
